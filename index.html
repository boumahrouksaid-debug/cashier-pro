<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>تحميل مشروع Hanout V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>body{font-family:Tahoma;text-align:center;padding:30px} button{padding:15px 30px;background:#1a3a5f;color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer}</style>
</head>
<body>
<h2>📦 مشروع حانوت V2 - جاهز للتحميل</h2>
<p>اضغط لتحميل كل الملفات منظمة في ZIP</p>
<button onclick="downloadZip()">📥 حمّل المشروع ZIP</button>
<script>
async function downloadZip(){
 const zip = new JSZip();
 zip.file("index.html", document.getElementById('f_index').textContent);
 zip.file("manifest.json", document.getElementById('f_manifest').textContent);
 zip.file("sw.js", document.getElementById('f_sw').textContent);
 zip.file("css/style.css", document.getElementById('f_css').textContent);
 zip.file("js/db.js", document.getElementById('f_db').textContent);
 zip.file("js/app.js", document.getElementById('f_app').textContent);
 zip.file("js/scanner.js", document.getElementById('f_scanner').textContent);
 zip.file("js/printer.js", document.getElementById('f_printer').textContent);
 zip.file("README.txt", "كيفاش تخدم:\n1- فك الضغط\n2- افتح المجلد في VS Code\n3- شغل Live Server\n4- ثبت التطبيق من Chrome -> تثبيت التطبيق");
 const blob = await zip.generateAsync({type:"blob"});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hanout-v2.zip'; a.click();
}

// الملفات
</script>

<!-- الملفات مخبية هنا -->
<script id="f_index" type="text/plain"><!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#1a3a5f"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css"><title>Hanout V2</title></head><body><div class="header">📦 حانوت V2 - نظام احترافي قابل للتطوير</div><div class="card"><h3>نظام المحاسبة V2</h3><p>هذا المشروع منظم باش تطورو لاحقا</p><button class="btn btn-p" onclick="location.reload()">تحديث</button></div><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script><script type="module" src="js/app.js"><\/script></body></html></script>
<script id="f_manifest" type="text/plain">{"name":"Hanout V2","short_name":"Hanout","start_url":"index.html","display":"standalone","background_color":"#1a3a5f","theme_color":"#1a3a5f","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/263/263142.png","sizes":"192x192","type":"image/png"}]}</script>
<script id="f_sw" type="text/plain">self.addEventListener('install',e=>{e.waitUntil(caches.open('hanout-v2').then(c=>c.addAll(['index.html','css/style.css'])))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})</script>
<script id="f_css" type="text/plain">:root{--p:#1a3a5f;--s:#27ae60}*{box-sizing:border-box}body{font-family:Tahoma;margin:0;background:#f1f4f8}.header{background:var(--p);color:#fff;padding:14px;text-align:center;font-weight:bold}.card{background:#fff;border-radius:12px;padding:14px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.btn{padding:10px 14px;border:none;border-radius:8px;color:#fff;cursor:pointer}.btn-p{background:var(--p)}.btn-s{background:var(--s)}input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0}</script>
<script id="f_db" type="text/plain">// db.js - هنا تطور قاعدة البيانات
export const DB = {
  save(key, data){ localStorage.setItem(key, JSON.stringify(data)); },
  load(key){ return JSON.parse(localStorage.getItem(key) || '[]'); }
};
// لاحقا فعل Supabase:
// import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
// export const supabase = createClient('YOUR_URL','YOUR_KEY')</script>
<script id="f_app" type="text/plain">import { DB } from './db.js';
let products = DB.load('products');
console.log('Hanout V2 جاهز ✅', products);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
<script id="f_scanner" type="text/plain">export function startScanner(onResult){
  const qr = new Html5Qrcode("reader");
  qr.start({facingMode:"environment"}, {fps:15, qrbox:250}, (code)=>{ onResult(code); qr.stop(); });
}</script>
<script id="f_printer" type="text/plain">export function printReceipt(sale){
  document.getElementById('r_total').innerText = sale.total + ' DA';
  window.print();
}</script>
</body>
</html>
