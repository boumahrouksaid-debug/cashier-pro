<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanout Pro V6 - Clients & Dettes</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;font-family:Tahoma}body{background:#0a0a0a;color:#fff;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{background:#111;display:flex;justify-content:space-between;padding:5px 8px;border-bottom:3px solid #ffeb00;align-items:center}
.ibtn{width:42px;height:42px;background:#e8f3ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#000}
.price{font-size:38px;color:#00ff19;font-weight:900;text-shadow:0 0 10px #00ff19}
.red{background:#b50000;display:flex;gap:5px;padding:6px;align-items:center;flex-wrap:wrap}
.red input{padding:8px;border:0;border-radius:5px}
.code{flex:1;background:#fff9c4;font-weight:bold;min-width:130px}
.main{flex:1;display:flex;overflow:hidden}
.left{width:45%;background:#1e1e1e;display:flex;flex-direction:column}
.hdr{background:#ffec9e;color:#000;display:flex;font-weight:bold;font-size:11px;padding:5px}
.hdr span{flex:1;text-align:center}
.inv{flex:1;overflow:auto;background:#2b2b2b}
.row{display:flex;font-size:12px;padding:6px;border-bottom:1px solid #3a3a3a}
.row div{flex:1;text-align:center}
.tot{background:yellow;color:#000;display:flex;justify-content:space-between;padding:7px;font-weight:900}
.client-bar{background:#005500;color:#fff;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.right{width:55%;background:#000;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:5px;overflow:auto}
.prod{background:#222;border:1px solid #444;border-radius:7px;padding:4px;text-align:center;cursor:pointer;height:86px;position:relative}
.prod .c{position:absolute;top:2px;left:2px;background:red;color:#fff;font-size:8px;padding:1px 4px;border-radius:3px}
.prod .p{position:absolute;bottom:2px;right:2px;background:#000;color:#0f0;font-size:8px;padding:1px 3px}
.prod .n{font-size:9px;color:#ffeb3b;margin-top:28px;height:16px;overflow:hidden}
.bottom{background:#1a1a1a;border-top:2px solid #b50000;display:flex;flex-direction:column;gap:3px;padding:4px}
.b-row{display:flex;gap:4px}
.b{flex:1;background:#2a2a2a;border:1px solid #444;border-radius:6px;padding:8px 2px;text-align:center;cursor:pointer;font-size:11px}
.b-green{background:#00a000;color:#fff;font-weight:bold}
.b-yellow{background:#ffeb00;color:#000;font-weight:bold}
.b-blue{background:#0044ff;color:#fff;font-weight:bold}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;z-index:99;padding:10px}
.box{background:#fff;color:#000;padding:14px;border-radius:12px;width:96%;max-width:420px;max-height:90vh;overflow:auto}
.box input{width:100%;padding:10px;margin:5px 0;border:2px solid #ddd;border-radius:8px}
.btn{padding:12px;border:0;border-radius:8px;font-weight:bold;width:100%;cursor:pointer;margin-top:6px}
.clist{max-height:300px;overflow:auto}
.citem{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #eee;cursor:pointer}
.citem:hover{background:#f0f0f0}
.debt{color:red;font-weight:bold}
@media(max-width:768px){.main{flex-direction:column}.left{height:48%}.right{height:52%;width:100%}.price{font-size:30px}}
</style></head><body>

<div class="top">
<div style="display:flex;gap:6px">
<div class="ibtn" onclick="openClientModal()" title="الزبائن">👥</div>
<div class="ibtn" onclick="openAdd()" title="إضافة سلعة">➕</div>
<div class="ibtn" onclick="showBilan()" title="Bilan">📊</div>
</div>
<div style="display:flex;gap:8px;align-items:center"><span>DA</span><div class="price" id="total">0,00</div></div>
</div>

<div class="client-bar" id="clientBar" style="display:none">
<span id="clientName">👤 زبون: -</span>
<span id="clientDebt">دين: 0 DA</span>
<button onclick="clearClient()" style="background:red;color:#fff;border:0;padding:3px 8px;border-radius:4px">X</button>
</div>

<div class="red">
<input id="codeIn" class="code" placeholder="سكانير سلعة أو كود زبون..." autofocus>
<input id="qte" type="number" value="1" style="width:55px;text-align:center">
<button onclick="addByScan()" style="background:#ffeb00;color:#000;border:0;padding:8px 12px;border-radius:6px;font-weight:bold">OK</button>
</div>

<div class="main">
<div class="left">
<div class="hdr"><span style="flex:2">Article</span><span>Qte</span><span>Prix</span><span>Montant</span></div>
<div class="inv" id="inv"></div>
<div class="tot"><span id="t1">0</span><span id="t2">0 DA</span></div>
</div>
<div class="right" id="grid"></div>
</div>

<div class="bottom">
<div class="b-row">
<div class="b" onclick="switchPage(1)">PAGE 01</div>
<div class="b" onclick="switchPage(2)">PAGE 02</div>
<div class="b" onclick="filterPain()">🍞 PAIN</div>
<div class="b b-blue" onclick="openClientModal()">👥 زبون</div>
</div>
<div class="b-row">
<div class="b" onclick="doRetour()">↩️ Retour</div>
<div class="b" onclick="openRemise()">% Remise</div>
<div class="b b-yellow" onclick="clearCart()">🗑️</div>
<div class="b b-green" onclick="sell(false)">💵 بيع نقدي</div>
<div class="b b-blue" onclick="sell(true)" style="background:#aa0000">📒 بيع دين</div>
</div>
</div>

<!-- MODAL CLIENTS -->
<div class="modal" id="mClients"><div class="box">
<h3>👥 خدمة الزبائن - الديون</h3>
<input id="searchClient" placeholder="بحث: اسم أو كودبار" oninput="renderClients()">
<div style="display:flex;gap:5px;margin:8px 0"><input id="cName" placeholder="اسم الزبون" style="flex:1"><input id="cPhone" placeholder="هاتف" style="flex:1"></div>
<button class="btn" style="background:#0044ff;color:#fff" onclick="addClient()">+ إضافة زبون جديد + كودبار</button>
<div id="barcodePreview" style="text-align:center;margin:10px 0;background:#fff;padding:5px"><svg id="bc"></svg></div>
<hr>
<div class="clist" id="clientList"></div>
<button class="btn" style="background:#ddd" onclick="closeM()">إغلاق</button>
</div></div>

<div class="modal" id="mAdd"><div class="box"><h3>➕ سلعة</h3><input id="aName" placeholder="اسم"><input id="aCode" placeholder="كود"><input id="aPrice" type="number" placeholder="سعر"><button class="btn" style="background:#00a000;color:#fff" onclick="saveAdd()">حفظ</button><button class="btn" style="background:#ddd" onclick="closeM()">إلغاء</button></div></div>
<div class="modal" id="mRem"><div class="box"><h3>% Remise</h3><input id="remVal" type="number" placeholder="10"><button class="btn" style="background:#000;color:#fff" onclick="applyRem()">تطبيق</button><button class="btn" style="background:#ddd" onclick="closeM()">إغلاق</button></div></div>

<script>
let pages={1:[{code:'A1',name:'خبز عادي',price:10},{code:'A2',name:'بيض',price:20},{code:'A3',name:'خبز بريوش',price:20},{code:'A4',name:'خبز سميد',price:20},{code:'A5',name:'أرز 10كلغ',price:220},{code:'A6',name:'تريدة',price:140},{code:'A7',name:'حمص',price:440},{code:'A8',name:'عدس',price:220}],2:[{code:'B1',name:'زيت 5ل',price:650},{code:'B2',name:'سكر',price:90},{code:'B3',name:'قهوة',price:280},{code:'B4',name:'حليب بودرة',price:1200}]};
let cur=1, cart=[], all=JSON.parse(localStorage.getItem('all6')||'null')||[...pages[1],...pages[2]], disc=0;
let clients=JSON.parse(localStorage.getItem('clients')||'[]');
let selectedClient=null;

function genCode(){return 'C'+Date.now().toString().slice(-6)}
function addClient(){
 let name=document.getElementById('cName').value.trim(), phone=document.getElementById('cPhone').value.trim();
 if(!name)return alert('اكتب الاسم');
 let code=genCode();
 let cl={id:Date.now(),name:name,phone:phone,barcode:code,debt:0,history:[]};
 clients.push(cl);localStorage.setItem('clients',JSON.stringify(clients));
 document.getElementById('cName').value='';document.getElementById('cPhone').value='';
 renderClients(); showBarcode(code);
}
function showBarcode(code){ try{JsBarcode("#bc",code,{format:"CODE128",width:1.5,height:50,displayValue:true});}catch(e){}}
function renderClients(){
 let q=(document.getElementById('searchClient').value||'').toLowerCase();
 let list=document.getElementById('clientList');
 list.innerHTML=clients.filter(c=>c.name.toLowerCase().includes(q)||c.barcode.toLowerCase().includes(q)||c.phone.includes(q)).map(c=>`
  <div class="citem" onclick="selectClient(${c.id})">
   <div><b>${c.name}</b><br><small>${c.phone} - ${c.barcode}</small></div>
   <div><span class="${c.debt>0?'debt':''}">${c.debt} DA</span><br><button onclick="event.stopPropagation();payDebt(${c.id})" style="background:green;color:#fff;border:0;padding:2px 6px;border-radius:4px;font-size:10px">دفع</button> <button onclick="event.stopPropagation();printClient(${c.id})" style="background:#000;color:#fff;border:0;padding:2px 6px;border-radius:4px;font-size:10px">🧾</button> <button onclick="event.stopPropagation();delClient(${c.id})" style="background:red;color:#fff;border:0;padding:2px 4px;border-radius:4px">X</button></div>
  </div>`).join('')||'<div style="padding:10px;text-align:center;color:#999">لا يوجد زبائن</div>';
}
function selectClient(id){
 selectedClient=clients.find(c=>c.id===id);
 document.getElementById('clientBar').style.display='flex';
 document.getElementById('clientName').textContent='👤 '+selectedClient.name+' ('+selectedClient.barcode+')';
 document.getElementById('clientDebt').textContent='دين سابق: '+selectedClient.debt+' DA';
 closeM();
}
function clearClient(){selectedClient=null;document.getElementById('clientBar').style.display='none'}
function payDebt(id){
 let c=clients.find(x=>x.id===id);
 let m=prompt('مبلغ الدفع للزبون '+c.name+' (دينه '+c.debt+' DA):');
 if(!m)return; m=parseInt(m); if(isNaN(m))return;
 c.debt=Math.max(0,c.debt-m); c.history.push({date:new Date().toLocaleString(),type:'دفع',amount:m});
 localStorage.setItem('clients',JSON.stringify(clients)); renderClients();
 if(selectedClient && selectedClient.id===id){document.getElementById('clientDebt').textContent='دين سابق: '+c.debt+' DA'}
}
function printClient(id){
 let c=clients.find(x=>x.id===id);
 let w=window.open('','','width=350,height=600');
 w.document.write(`<html dir=rtl><body style="font-family:Tahoma;text-align:center"><h2>بطاقة زبون</h2><h3>${c.name}</h3><p>${c.phone}</p><svg id="bc2"></svg><p>كود: ${c.barcode}</p><h3 style="color:red">الدين: ${c.debt} DA</h3><hr><div>${c.history.slice(-10).map(h=>`<div>${h.date} - ${h.type}: ${h.amount} DA</div>`).join('')}</div><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script><script>JsBarcode("#bc2","${c.barcode}",{format:"CODE128"});window.print()<\/script></body></html>`);
}
function delClient(id){if(confirm('حذف الزبون؟')){clients=clients.filter(c=>c.id!==id);localStorage.setItem('clients',JSON.stringify(clients));renderClients();if(selectedClient&&selectedClient.id===id)clearClient()}}
function openClientModal(){document.getElementById('mClients').style.display='flex';renderClients()}
function draw(){document.getElementById('grid').innerHTML=pages[cur].map(p=>`<div class="prod" onclick="add('${p.code}')"><div class="c">${p.code}</div><div style="height:48px;background:#333;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:22px">🍞</div><div class="n">${p.name}</div><div class="p">${p.price}</div></div>`).join('')}
function add(code){
 let pr=all.find(x=>x.code===code);
 if(!pr){
  let cl=clients.find(c=>c.barcode===code);
  if(cl){selectClient(cl.id);return}
  return alert('غير موجود: '+code);
 }
 let q=parseInt(document.getElementById('qte').value)||1;
 let ex=cart.find(x=>x.code===code);
 if(ex)ex.qty+=q;else cart.push({...pr,qty:q});
 render();
}
function addByScan(){let v=document.getElementById('codeIn').value.toUpperCase().trim();if(!v)return;add(v);document.getElementById('codeIn').value=''}
function render(){
 let t=0;document.getElementById('inv').innerHTML=cart.map(x=>{let m=x.price*x.qty;t+=m;return `<div class="row"><div style="flex:2;text-align:right">${x.name}</div><div>${x.qty}</div><div>${x.price}</div><div>${m}</div></div>`}).join('');
 if(disc>0)t=t-t*disc/100;
 document.getElementById('total').textContent=t.toFixed(2).replace('.',',');
 document.getElementById('t1').textContent=cart.length+' مادة';
 document.getElementById('t2').textContent=t+' DA';
}
function sell(isDebt){
 if(!cart.length)return alert('السلة فارغة');
 let tot=cart.reduce((s,c)=>s+c.price*c.qty,0); if(disc>0)tot=tot-tot*disc/100;
 if(isDebt){
  if(!selectedClient)return alert('اختار الزبون أولا من زر 👥 زبون');
  selectedClient.debt+=tot;
  selectedClient.history.push({date:new Date().toLocaleString(),type:'دين جديد',amount:tot,items:[...cart]});
  localStorage.setItem('clients',JSON.stringify(clients));
  alert('تم تسجيل دين '+tot+' DA على الزبون '+selectedClient.name+'\nمجموع ديونه: '+selectedClient.debt+' DA');
 }else{
  if(selectedClient){
   let pay=confirm('الزبون '+selectedClient.name+' عندو دين '+selectedClient.debt+' DA\nهل تريد خصم هذا البيع من دينه؟');
   if(pay){selectedClient.debt=Math.max(0,selectedClient.debt-tot);selectedClient.history.push({date:new Date().toLocaleString(),type:'دفع مع بيع',amount:tot});localStorage.setItem('clients',JSON.stringify(clients));}
  }
 }
 printTicket(tot,isDebt); cart=[];disc=0; render();
}
function printTicket(tot,isDebt){
 let w=window.open('','','width=320,height=600');
 let clientInfo=selectedClient?`<div>الزبون: ${selectedClient.name} (${selectedClient.barcode})<br>الدين الكلي: ${selectedClient.debt} DA</div><hr>`:'';
 let type=isDebt?'فاتورة دين':'فاتورة نقدية';
 w.document.write(`<html dir=rtl><body style="font-family:Tahoma;text-align:center"><h3>${type}</h3>${clientInfo}<hr>${cart.map(c=>`<div style="display:flex;justify-content:space-between"><span>${c.name} x${c.qty}</span><span>${c.price*c.qty} DA</span></div>`).join('')}<hr><h2>${tot} DA</h2><p>${new Date().toLocaleString()}</p><script>window.print();window.close()<\/script></body></html>`);
}
function switchPage(n){cur=n;draw()}
function filterPain(){cur=1;draw()}
function doRetour(){cart.pop();render()}
function clearCart(){if(confirm('تفرغ السلة؟')){cart=[];render()}}
function changeQty(d){let e=document.getElementById('qte');e.value=Math.max(1,parseInt(e.value)+d)}
function openAdd(){document.getElementById('mAdd').style.display='flex'}
function closeM(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none')}
function saveAdd(){let n=document.getElementById('aName').value, c=document.getElementById('aCode').value, p=parseInt(document.getElementById('aPrice').value);if(!n||!c||!p)return alert('كمل');let np={code:c,name:n,price:p};all.push(np);pages[cur].push(np);localStorage.setItem('all6',JSON.stringify(all));draw();closeM()}
function openRemise(){document.getElementById('mRem').style.display='flex'}
function applyRem(){disc=parseInt(document.getElementById('remVal').value)||0;render();closeM()}
function showBilan(){let tot=cart.reduce((s,c)=>s+c.price*c.qty,0);alert(`Bilan\nمواد: ${cart.length}\nمجموع: ${tot} DA\nديون الزبائن الكلي: ${clients.reduce((s,c)=>s+c.debt,0)} DA`)}
document.getElementById('codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')addByScan()});
draw();render();
</script></body></html>
